name: Claude Code

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  # Public repository: only org members and collaborators may trigger Pi through mentions.
  pi:
    if: >-
      github.event_name == 'pull_request' ||
      ((contains(github.event.comment.body, '@pi-iai') || contains(github.event.review.body, '@pi-iai')) &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
          github.event.comment.author_association || github.event.review.author_association))
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: ./.github/workflows/pi-iai.yml
