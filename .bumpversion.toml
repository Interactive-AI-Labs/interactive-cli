[tool.bumpversion]
current_version = "0.42.0-beta.3"
commit = true
tag = false
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(-beta\\.(?P<dev>\\d+))?"
serialize = [
    "{major}.{minor}.{patch}-beta.{dev}",
    "{major}.{minor}.{patch}",
]
message = "Bump: {current_version} → {new_version}"
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "internal/buildinfo/version.go"
search = "\"{current_version}\""
replace = "\"{new_version}\""
